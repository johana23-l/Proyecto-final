<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420">
  <rect x="20" y="20" width="620" height="380" rx="36" fill="#0e172a" stroke="#334155" stroke-width="3" />
  <path d="M80 90h500" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />
  <text x="80" y="150" fill="#dbeafe" font-family="Arial" font-size="22">def sumar(a, b):</text>
  <text x="100" y="190" fill="#a5b4fc" font-family="Arial" font-size="20">return a + b</text>
